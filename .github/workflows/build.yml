name: Build TWS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus
        shell: pwsh
        run: choco install lazarus --forcex86 --no-progress --yes --retry-count=5 --retry-wait=10

      - name: Configure FPC paths
        shell: pwsh
        run: |
          $paths = @(
            'C:\lazarus',
            'C:\lazarus\fpc\3.2.2\bin\i386-win32'
          )
          $env:Path = (($paths -join ';') + ';' + $env:Path)
          $paths | Add-Content -Path $env:GITHUB_PATH
          if (-not (Test-Path 'C:\lazarus\fpc\3.2.2\bin\i386-win32\fpc.exe')) {
            throw '32-bit FPC executable was not installed'
          }
          if (-not (Test-Path 'C:\lazarus\fpc\3.2.2\bin\i386-win32\ppc386.exe')) {
            throw '32-bit FPC executable was not installed'
          }
          Get-Command fpc
          Get-Command ppc386
          & fpc.exe -iV
          & ppc386.exe -iV

      - name: Validate converted project
        shell: pwsh
        run: |
          if (Test-Path TWS.dpr) { throw 'TWS.dpr must not be present after conversion' }
          if (-not (Test-Path TWS.lpr)) { throw 'TWS.lpr is missing' }
          if (-not (Test-Path TWS.lpi)) { throw 'TWS.lpi is missing' }

      - name: Build Win32
        shell: pwsh
        run: |
          $lazbuild = 'C:\lazarus\lazbuild.exe'
          if (-not (Test-Path $lazbuild)) { throw "lazbuild not found: $lazbuild" }
          & $lazbuild --build-all --os=win32 --cpu=i386 TWS.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Win32 build
        shell: pwsh
        run: |
          $packageDir = 'TWS-win32'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item 'lib/units/TWS.exe' "$packageDir/TWS.exe"
          Copy-Item 'innosetup/TWS_MainFiles/*' $packageDir -Recurse -Force
          Compress-Archive -Path "$packageDir/*" -DestinationPath 'TWS-win32.zip' -Force

      - name: Upload Win32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWS-win32
          path: TWS-win32.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" TWS-win32.zip --title "TWS ${{ github.ref_name }}" --generate-notes

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lazarus-build-output
          path: |
            lib/units/**
            *.log
          if-no-files-found: ignore